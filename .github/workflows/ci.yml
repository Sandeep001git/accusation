name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --runInBand

      - name: Audit dependencies
        run: |
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high

      - name: Configure non-secret values for Compose validation
        run: |
          printf '%s\n' \
            'DATABASE_URL=postgresql://ci:ci@127.0.0.1:5432/ci' \
            'JWT_SECRET=ci-only-placeholder-secret' \
            'ARCJET_API_KEY=ci-only-placeholder-key' \
            > .env.production

      - name: Validate production Compose configuration
        run: |
          docker compose \
            --project-name accusation-ci \
            --env-file .env.production \
            --file compose.prod.yaml \
            config --quiet

      - name: Build migration image
        run: docker build --pull --target migrate --tag accusation-migrate:${{ github.sha }} .

      - name: Build production image
        run: docker build --pull --target production --tag accusation-api:${{ github.sha }} .

      - name: Upload coverage report
        if: always() && hashFiles('coverage/index.html') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report-${{ github.sha }}
          path: coverage/
          if-no-files-found: error
          retention-days: 7
